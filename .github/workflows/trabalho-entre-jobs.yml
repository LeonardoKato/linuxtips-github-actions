name: Vendo arquivos compartilhados entre Jobs

on:
    push:
        branches:
         - main

jobs:
    job_1:
      runs-on: ubuntu-latest
      steps:
        - name: Confere versao Ubuntu
          run: cat /etc/os-release

        - name: Exibir msg
          run: echo "Teste do meu primeiro workflow" > ${{ github.workspace }}/msg.txt
        
        - uses: actions/upload-artifact@v4
          with:
            name: strigus-upload
            path: ${{ github.workspace }}/msg.txt

    job_2:
      runs-on: ubuntu-latest
      needs: job_1
      steps:
        - name: Another brick on the wall
          run: ls -lha

        - uses: actions/download-artifact@v4
          with:
            name: strigus-upload
            path: strigus  

        - name: Ver conteudo do diretorio
          run: ls -lha && ls ./strigus/

        - name: Move Arquivo msg
          run: mv strigus/msg.txt . && rm -rf ./strigus 
        
        - name: Another brick on the wall
          run: ls -lha

        - name: Acessa arquivo msg
          run: cat msg.txt